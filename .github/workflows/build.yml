  build-ios:
    name: Build for iOS (arm64)
    runs-on: macos-latest
    env:
      IOS_DEPLOY_TARGET: "16.4"
    steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ env.SOURCE_REPO }}
        token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        ref: ${{ inputs.source-ref || github.ref_name }}
        fetch-depth: 0

    - name: Get toolchain ID for cache key
      run: |
        CLANG_VER=$(clang --version | head -1 | sed -nE 's/.*version ([0-9.]+).*/\1/p')
        echo "VCPKG_TC=clang-${CLANG_VER:-unknown}" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: vcpkg-cache
        key: vcpkg-ios-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMake/triplets/arm64-ios.cmake') }}
        restore-keys: |
          vcpkg-ios-${{ env.VCPKG_TC }}-
          vcpkg-ios-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build PvZ-Portable for iOS
      run: |
        BUILD_DIR=build-ios

        cmake -B $BUILD_DIR \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/CMake/triplets \
          -DVCPKG_TARGET_TRIPLET=arm64-ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOY_TARGET \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_BUILD_TYPE=Release \
          -G Xcode

        cmake --build $BUILD_DIR --config Release -- \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=NO

    - name: Create unsigned IPA
      run: |
        APP_PATH=$(find build-ios -name "pvz-portable.app" -path "*Release*" | head -1)
        if [ -f "build-ios/Info.plist" ]; then
          cp build-ios/Info.plist "$APP_PATH/Info.plist"
        fi
        sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/io.github.wszqkzqk.pvz-portable/g' "$APP_PATH/Info.plist" || true
        sed -i '' 's/\$(EXECUTABLE_NAME)/pvz-portable/g' "$APP_PATH/Info.plist" || true
        sed -i '' 's/\$(PRODUCT_NAME)/PvZ Portable/g' "$APP_PATH/Info.plist" || true

        codesign --force --deep --sign - "$APP_PATH" || true

        mkdir -p dist/Payload
        cp -R "$APP_PATH" dist/Payload/
        cd dist
        zip -r -y pvz-portable-ios-arm64.ipa Payload/
        rm -rf Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-ios
        path: dist/

  build-ios-ipad-mini-1:
    name: Build for iOS armv7 (iPad mini 1 / A5 chip)
    runs-on: macos-14
    env:
      IOS10_SDK_TAG: iPhoneOS10.3.sdk
      IOS10_SDK_REPO: theos/sdks
    steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ env.SOURCE_REPO }}
        token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        ref: ${{ inputs.source-ref || github.ref_name }}
        fetch-depth: 0

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        key: ${{ runner.os }}-ios-ipadmini1

    - name: Select Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Inject iOS 10.3 SDK into Xcode
      run: |
        SDKS_DIR="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
        echo "Xcode SDKs dir: $SDKS_DIR"
        echo "Available SDKs before injection:"
        ls "$SDKS_DIR"

        IOS10_SYSROOT="$SDKS_DIR/${{ env.IOS10_SDK_TAG }}"
        echo "IOS10_SYSROOT=$IOS10_SYSROOT" >> $GITHUB_ENV

        if [ ! -d "$IOS10_SYSROOT" ]; then
          echo "Cloning ${{ env.IOS10_SDK_TAG }} from ${{ env.IOS10_SDK_REPO }} via sparse checkout..."
          git clone --depth 1 --filter=blob:none --sparse https://github.com/${{ env.IOS10_SDK_REPO }} ios-sdks-repo
          cd ios-sdks-repo
          git sparse-checkout set ${{ env.IOS10_SDK_TAG }}
          cd ..
          sudo mv ios-sdks-repo/${{ env.IOS10_SDK_TAG }} "$SDKS_DIR/"

          sudo cp -R "$SDKS_DIR/iPhoneOS.sdk/usr/include/c++/" "$SDKS_DIR/${{ env.IOS10_SDK_TAG }}/usr/include/c++/"
        fi

        echo "Available SDKs after injection:"
        ls "$SDKS_DIR"

        if [ ! -d "$SDKS_DIR/${{ env.IOS10_SDK_TAG }}" ]; then
          echo "ERROR: SDK injection failed!"
          exit 1
        fi
        echo "iOS 10.3 SDK successfully injected."

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build PvZ-Portable for iPad mini 1 (armv7, iOS 9.0)
      run: |
        BUILD_DIR=build-ios-ipadmini1

        cmake -B $BUILD_DIR \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=armv7-ios \
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/ios/triplets" \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=9.0 \
          -DCMAKE_OSX_ARCHITECTURES=armv7 \
          -DCMAKE_OSX_SYSROOT="$IOS10_SYSROOT" \
          -DIOS_DEPLOYMENT_TARGET=9.0 \
          -DIOS_IPADMINI1=ON \
          -DCMAKE_CXX_FLAGS="-D_LIBCPP_DISABLE_AVAILABILITY" \
          -DCMAKE_C_FLAGS="-D_LIBCPP_DISABLE_AVAILABILITY" \
          -DCMAKE_EXE_LINKER_FLAGS="-F$GITHUB_WORKSPACE/dummy_frameworks -lobjc -Wl,-undefined,dynamic_lookup" \
          -DLOW_MEMORY=ON \
          -DPVZ_DEBUG=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -G Ninja

        cmake --build $BUILD_DIR --config Release > build_log.txt 2>&1 || (tail -n 100 build_log.txt && exit 1)

    - name: Create unsigned IPA for iPad mini 1
      run: |
        APP_PATH=$(find build-ios-ipadmini1 -name "pvz-portable.app" | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: .app bundle not found!"
          exit 1
        fi
        echo "Found app at: $APP_PATH"

        echo "Binary architectures:"
        lipo -info "$APP_PATH/pvz-portable" || true

        echo "Compiling asset catalog..."
        rm -rf "$APP_PATH/Assets.xcassets"
        xcrun actool \
          --compile "$APP_PATH" \
          --platform iphoneos \
          --minimum-deployment-target 9.0 \
          --target-device ipad \
          --app-icon AppIcon \
          --output-format human-readable-text \
          --output-partial-info-plist /tmp/actool-partial.plist \
          ios/Assets.xcassets || echo "actool warning (non-fatal)"

        cp ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png "$APP_PATH/Icon.png" || true

        echo "Compiling launch screen storyboard..."
        rm -f "$APP_PATH/LaunchScreen.storyboard"
        xcrun ibtool \
          --compile "$APP_PATH/LaunchScreen.storyboardc" \
          --sdk "$IOS10_SYSROOT" \
          ios/LaunchScreen.storyboard || echo "ibtool warning (non-fatal)"

        if [ -f "build-ios-ipadmini1/Info.plist" ]; then
          cp build-ios-ipadmini1/Info.plist "$APP_PATH/Info.plist"
        fi
        sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/io.github.wszqkzqk.pvz-portable/g' "$APP_PATH/Info.plist" || true
        sed -i '' 's/\$(EXECUTABLE_NAME)/pvz-portable/g' "$APP_PATH/Info.plist" || true
        sed -i '' 's/\$(PRODUCT_NAME)/PvZ Portable/g' "$APP_PATH/Info.plist" || true

        echo "Ad-hoc signing app bundle..."
        codesign --force --deep --sign - "$APP_PATH" || true

        mkdir -p dist/Payload
        cp -R "$APP_PATH" dist/Payload/
        cd dist
        zip -r -y pvz-portable-ios-armv7-ipadmini1.ipa Payload/
        rm -rf Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-ios-ipad-mini-1
        path: dist/

  build-wasm:
    name: Build for WebAssembly (Emscripten)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ env.SOURCE_REPO }}
        token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        ref: ${{ inputs.source-ref || github.ref_name }}
        fetch-depth: 0

    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v16

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Build libopenmpt for Emscripten
      run: |
        SYSROOT="$(em-config EMSCRIPTEN_ROOT)/cache/sysroot"
        OPENMPT_TAG=$(git ls-remote --tags https://github.com/OpenMPT/openmpt.git 'refs/tags/libopenmpt-*' \
          | sed 's|.*refs/tags/libopenmpt-||' \
          | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$OPENMPT_TAG" ]; then
          OPENMPT_TAG="0.8.4"
        fi
        echo "Using libopenmpt version: $OPENMPT_TAG"
        git clone --depth=1 --branch "libopenmpt-${OPENMPT_TAG}" https://github.com/OpenMPT/openmpt.git /tmp/libopenmpt-src
        cd /tmp/libopenmpt-src
        emmake make CONFIG=emscripten \
          STATIC_LIB=1 SHARED_LIB=0 \
          EXAMPLES=0 OPENMPT123=0 TEST=0 \
          NO_ZLIB=1 NO_MPG123=1 NO_OGG=1 NO_VORBIS=1 NO_VORBISFILE=1 \
          NO_PORTAUDIO=1 NO_PORTAUDIOCPP=1 NO_PULSEAUDIO=1 \
          NO_SDL2=1 NO_FLAC=1 NO_SNDFILE=1 \
          -j$(nproc)
        emmake make CONFIG=emscripten \
          STATIC_LIB=1 SHARED_LIB=0 \
          EXAMPLES=0 OPENMPT123=0 TEST=0 \
          PREFIX="${SYSROOT}" install

    - name: Build PvZ-Portable for WebAssembly
      run: |
        mkdir build-wasm
        emcmake cmake -G Ninja -B build-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-wasm -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-wasm
        path: |
          build-wasm/pvz-portable.html
          build-wasm/pvz-portable.js
          build-wasm/pvz-portable.wasm

  build-nintendo-switch:
    name: Build for Nintendo Switch
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ env.SOURCE_REPO }}
        token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        ref: ${{ inputs.source-ref || github.ref_name }}
        fetch-depth: 0

    - name: Cache libopenmpt (Switch)
      id: cache-switch-libopenmpt
      uses: actions/cache@v4
      with:
        path: |
          /opt/devkitpro/portlibs/switch/include/libopenmpt
          /opt/devkitpro/portlibs/switch/lib/libopenmpt.a
        key: ${{ runner.os }}-switch-libopenmpt-v1
        restore-keys: |
          ${{ runner.os }}-switch-libopenmpt-

    - name: Install Switch dependencies
      run: |
        dkp-pacman -S --needed --noconfirm \
          switch-sdl2 \
          switch-libogg \
          switch-libvorbis \
          switch-mpg123 \
          switch-libpng \
          switch-libjpeg-turbo \
          switch-zlib \
          switch-cmake

    - name: Compile libopenmpt for Switch
      if: steps.cache-switch-libopenmpt.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ -f "/opt/devkitpro/portlibs/switch/lib/libopenmpt.a" ]; then
          echo "libopenmpt is already cached, skipping."
        else
          source $DEVKITPRO/switchvars.sh
          git clone --depth 1 https://github.com/OpenMPT/openmpt
          cd openmpt
          make CONFIG=gcc SHARED_LIB=0 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 PREFIX=$PORTLIBS_PREFIX CC="aarch64-none-elf-gcc" CXX="aarch64-none-elf-g++" install
        fi

    - name: Build PvZ-Portable for Nintendo Switch
      shell: bash
      run: |
        source $DEVKITPRO/switchvars.sh
        mkdir -p build-switch
        cmake -B build-switch \
          -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
          -DNINTENDO_SWITCH=ON \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-switch

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-nintendo-switch
        path: |
          build-switch/pvz-portable.nro
          build-switch/pvz-portable.elf

  build-ps4:
    name: Build for PS4 (homebrew, OpenOrbis)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ env.SOURCE_REPO }}
        token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        ref: ${{ inputs.source-ref || github.ref_name }}
        fetch-depth: 0

    - name: Install toolchain prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang lld llvm cmake ninja-build curl tar bzip2 autoconf automake libtool pkg-config

    - name: Fetch the OpenOrbis toolchain
      run: |
        OO_VERSION=v0.5.2
        mkdir -p "$HOME/OpenOrbis"
        curl -fsSL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/$OO_VERSION/$OO_VERSION.tar.gz" \
          | tar -xz -C "$HOME/OpenOrbis"
        echo "OO_PS4_TOOLCHAIN=$HOME/OpenOrbis/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

    # Cross-building the dependency stack takes a while, mostly libopenmpt.
    - name: Cache PS4 dependencies
      id: cache-ps4-deps
      uses: actions/cache@v4
      with:
        path: |
          ~/OpenOrbis/OpenOrbis/PS4Toolchain/lib
          ~/OpenOrbis/OpenOrbis/PS4Toolchain/include
        key: ps4-deps-v1-${{ hashFiles('CMake/ps4-build-deps.sh') }}

    - name: Cross-compile dependencies
      if: steps.cache-ps4-deps.outputs.cache-hit != 'true'
      run: bash CMake/ps4-build-deps.sh "$RUNNER_TEMP/ps4-deps"

    - name: Build PvZ-Portable for PS4
      run: |
        cmake -B build-ps4 -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=CMake/PS4Toolchain.cmake \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-ps4 --target ps4-pkg

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-ps4
        path: |
          build-ps4/pvz-portable.elf
          build-ps4/pkg/eboot.bin
          build-ps4/pkg/*.pkg
          build-ps4/pkg/shaders/*.sb

  release:
    name: Release
    needs: ['build-archlinux', 'build-linux-static', 'build-windows-msys2-ucrt64', 'build-windows-msvc-x64', 'build-windows-msvc-x86', 'build-windows-uwp', 'build-macos', 'build-android', 'build-android-32', 'build-ios', 'build-ios-ipad-mini-1', 'build-wasm', 'build-nintendo-switch']
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare Release Files
      run: |
        mkdir release_files

        echo "Preparing Arch Linux file..."
        chmod +x artifacts/pvz-portable-archlinux/pvz-portable
        mv artifacts/pvz-portable-archlinux/pvz-portable release_files/pvz-portable-archlinux-x86_64

        echo "Preparing Linux static file..."
        chmod +x artifacts/pvz-portable-linux-static/pvz-portable
        mv artifacts/pvz-portable-linux-static/pvz-portable release_files/pvz-portable-linux-static-x86_64

        echo "Preparing Windows MSVC x64 file..."
        mv artifacts/pvz-portable-windows-msvc-x64/pvz-portable.exe release_files/pvz-portable-windows-msvc-x64-static.exe

        echo "Preparing Windows MSVC x86 file..."
        mv artifacts/pvz-portable-windows-msvc-x86/pvz-portable.exe release_files/pvz-portable-windows-msvc-x86-static.exe

        echo "Preparing Windows MSYS2 file..."
        mv artifacts/pvz-portable-windows-msys2-ucrt64/pvz-portable.exe release_files/pvz-portable-windows-ucrt64-static.exe

        echo "Preparing UWP file..."
        mv artifacts/pvz-portable-uwp-appx/*.appx release_files/ 2>/dev/null || true

        echo "Preparing macOS file..."
        cd artifacts/pvz-portable-macos
        chmod +x pvz-portable
        zip -r -y ../../release_files/pvz-portable-macos-aarch64.zip .
        cd ../..

        echo "Preparing Android file..."
        mv artifacts/pvz-portable-android/pvz-portable-android-arm64-v8a.apk release_files/pvz-portable-android-arm64-v8a.apk

        echo "Preparing Android 32-bit file..."
        mv artifacts/pvz-portable-android-32/pvz-portable-android-armeabi-v7a.apk release_files/pvz-portable-android-armeabi-v7a.apk

        echo "Preparing iOS 15 file..."
        mv artifacts/pvz-portable-ios/pvz-portable-ios-arm64.ipa release_files/pvz-portable-ios-arm64.ipa

        echo "Preparing iOS 9 (iPad Mini 1 32-bit) file..."
        if [ -f artifacts/pvz-portable-ios-ipad-mini-1/pvz-portable-ios-armv7-ipadmini1.ipa ]; then
          mv artifacts/pvz-portable-ios-ipad-mini-1/pvz-portable-ios-armv7-ipadmini1.ipa release_files/pvz-portable-ios-armv7-ipadmini1.ipa
        fi

        echo "Preparing WebAssembly file..."
        cd artifacts/pvz-portable-wasm
        zip -r ../../release_files/pvz-portable-wasm.zip .
        cd ../..

        echo "Preparing Nintendo Switch files..."
        if [ -f artifacts/pvz-portable-nintendo-switch/pvz-portable.nro ]; then
          mv artifacts/pvz-portable-nintendo-switch/pvz-portable.nro release_files/pvz-portable-nintendo-switch.nro
        fi
        if [ -f artifacts/pvz-portable-nintendo-switch/pvz-portable.elf ]; then
          mv artifacts/pvz-portable-nintendo-switch/pvz-portable.elf release_files/pvz-portable-nintendo-switch.elf
        fi

        echo "Final files:"
        ls -lh release_files/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_files/*
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Release' }}
        generate_release_notes: true
        draft: false
        prerelease: ${{ github.ref_type != 'tag' }}
